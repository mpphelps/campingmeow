name: campingmeow-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: campingmeow:latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - packages/database/.env
    environment:
      # Keep the heap well inside the box. Without a ceiling Node grows until
      # the machine is out of memory and the kernel picks a victim; with one it
      # collects, and if it genuinely cannot it dies loudly with a heap error
      # instead of silently.
      NODE_OPTIONS: --max-old-space-size=1024
    # A container limit is what makes Docker report OOMKilled=true. Without it
    # the kernel kills the process and Docker reports nothing useful.
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?missing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: ${POSTGRES_DB:?missing}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?missing}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  pgdata_prod:
